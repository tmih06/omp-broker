name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Vite+ runs on Node; Oxfmt/Oxlint do not use the Bun runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tsc
        run: bun run check
      - name: Check formatting
        run: bun run fmt:check
      - name: Lint
        run: bun run lint -- --deny-warnings

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        run: bun run build

  test:
    name: Test (${{ matrix.os }}, Bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.4.4", latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit installed packages
        run: bun audit

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile standalone binary
        run: bun run build
      - name: Smoke binary
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find dist -maxdepth 1 -type f -name 'omp-broker*' ! -name '*.map' | head -n 1)
          test -n "$binary"
          "$binary" --version
      - name: Smoke HTTP server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/omp-broker-home"
          mkdir -p "$home"
          export OMP_BROKER_HOME="$home"
          export OMP_BROKER_STORAGE=local
          export OMP_BROKER_DB="$home/auth.db"
          export OMP_BROKER_TOKEN=ci-token

          ./dist/omp-broker serve --bind=127.0.0.1:4123 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4123/healthz >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:4123/healthz | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4123/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:4123/v1/models)" = 200

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: omp-broker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm omp-broker:ci --version
          docker run -d --name omp-broker-ci -p 14000:4000 -e OMP_BROKER_TOKEN=ci-token omp-broker:ci
          cleanup() { docker rm -f omp-broker-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:14000/healthz >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          curl -fsS http://127.0.0.1:14000/healthz | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14000/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:14000/v1/models)" = 200
